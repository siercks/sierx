# Build once, stage candidates, test exact digests natively, then promote.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIERX_RELEASE_REPOSITORY: ghcr.io/siercks/sierx

jobs:
  source:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  build:
    needs: [source, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install packaging prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - run: make release-binaries release-image
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.sha }}
      - run: make sbom SBOM_OUT=dist/sbom-${{ matrix.arch }}.cdx.json
      - run: make sbom-check SBOM_OUT=dist/sbom-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sierx-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  stage:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sierx-*
          path: dist
          merge-multiple: true
      - name: Install publishing prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - run: make release-login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make release-stage ARCH=amd64
        env:
          TAG: ${{ github.sha }}
      - run: make release-stage ARCH=arm64
        env:
          TAG: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-references
          path: dist/image-*.txt
          if-no-files-found: error

  artifact-test:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-references
          path: dist
      - name: Install native acceptance prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman python3 curl
      - run: make release-login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make release-test
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ matrix.arch }}
          path: dist/acceptance-${{ matrix.arch }}.json
          if-no-files-found: error

  promote:
    needs: artifact-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sierx-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-references
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acceptance-*
          path: dist
          merge-multiple: true
      - name: Install promotion prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - run: make release-login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make release-manifest
        env:
          TAG: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-manifest
          path: |
            dist/release.json
            dist/acceptance-*.json
            dist/manifest.json
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/release.json
            dist/acceptance-*.json
            dist/sbom-*.cdx.json
            dist/sierx-*
            dist/sierxctl-*
            dist/ca-certificates-*.sha256
          fail_on_unmatched_files: true
