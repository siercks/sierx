# Release: two NATIVE build jobs and a manifest merge. No QEMU (§1.1) — a
# cross-built arm64 binary under emulation takes minutes and tells you nothing
# about the target, and the free arm64 runner makes emulation pointless.
#
# Every step is a make target or an action. SBOM per release (task 0.13), base
# images pinned by digest, -trimpath and CGO_ENABLED=0 for a reproducible
# artifact (§15.4).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/siercks/sierx

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: make release-binaries
        env:
          GOARCH: ${{ matrix.arch }}

      # SBOM via make, not an action: BUILD §3.4 — nothing may live only in
      # CI YAML, and an SBOM nobody can regenerate locally is an SBOM nobody
      # checks. scripts/sbom.sh reads the same inputs as gate-license, so the
      # two cannot disagree about what is in the build.
      - run: make sbom SBOM_OUT=dist/sbom-${{ matrix.arch }}.cdx.json
      - run: make sbom-check SBOM_OUT=dist/sbom-${{ matrix.arch }}.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sierx-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image per architecture from the native binaries, then a manifest
      # that ties them together. The base image is pinned by digest in
      # deploy/Containerfile (§15.4).
      - run: make release-image ARCH=amd64 TAG=${{ github.sha }}
      - run: make release-image ARCH=arm64 TAG=${{ github.sha }}
      - run: make release-manifest TAG=${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-manifest
          path: dist/release.json

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
