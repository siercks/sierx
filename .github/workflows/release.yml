# Release: two NATIVE build jobs and a manifest merge. No QEMU (§1.1) — a
# cross-built arm64 binary under emulation takes minutes and tells you nothing
# about the target, and the free arm64 runner makes emulation pointless.
#
# Every step is a make target or an action. SBOM per release (task 0.13), base
# images pinned by digest, -trimpath and CGO_ENABLED=0 for a reproducible
# artifact (§15.4).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/siercks/sierx

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - run: make release-binaries
        env:
          GOARCH: ${{ matrix.arch }}

      # SBOM via make, not an action: BUILD §3.4 — nothing may live only in
      # CI YAML, and an SBOM nobody can regenerate locally is an SBOM nobody
      # checks. scripts/sbom.sh reads the same inputs as gate-license, so the
      # two cannot disagree about what is in the build.
      - run: make sbom SBOM_OUT=dist/sbom-${{ matrix.arch }}.cdx.json
      - run: make sbom-check SBOM_OUT=dist/sbom-${{ matrix.arch }}.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sierx-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image per architecture from the native binaries, then a manifest
      # that ties them together. The base image is pinned by digest in
      # deploy/Containerfile (§15.4).
      - run: make release-image ARCH=amd64 TAG=${{ github.sha }}
      - run: make release-image ARCH=arm64 TAG=${{ github.sha }}
      - run: make release-manifest TAG=${{ github.sha }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-manifest
          path: dist/release.json

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
