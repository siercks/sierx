# Fast native reproduction of the final acquisition operation; not a release gate.
name: acquisition-diagnostic
on:
  push:
    branches: ["codex/**"]
    paths:
      - "scripts/offline-local-registry.py"
      - "scripts/probe-acquisition*"
      - ".github/workflows/acquisition-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acquisition-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: Native acquisition diagnostic (${{ matrix.arch }}; no release acceptance)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install diagnostic prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman strace iproute2 openssl
      - run: make release-binaries release-image
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.sha }}
      - run: make probe-offline-acquisition
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acquisition-diagnostic-${{ matrix.arch }}
          path: dist/acquisition-diagnostic-*.json
          if-no-files-found: error
