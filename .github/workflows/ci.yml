# CI runs `make gate-1` and nothing else (BUILD §3.4). No inline shell beyond a
# single make invocation per job: anything CI can do, a human must be able to
# run locally and offline, and a step that exists only here is a step nobody
# can reproduce.
#
# Public repository, so this uses the free 4 vCPU runners (§1.1).
name: ci

on:
  push:
    branches: ["main", "phase/**", "build/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # PostgreSQL 18, pinned by digest like every other image (§15.4).
      # `make db-up` drives a rootless Quadlet unit on a real host; in CI the
      # service container is the equivalent, and the only difference the build
      # sees is DATABASE_URL.
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: sierx
          POSTGRES_PASSWORD: sierx
          POSTGRES_DB: sierx
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sierx -d sierx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SIERX_ENV: dev
      DATABASE_URL: postgres://sierx:sierx@localhost:5432/sierx
      SIERX_BACKUP_DRIVERS: pgdump
      PGBACKREST_REPO_TYPE: posix
      PGBACKREST_REPO_PATH: .backups/physical
      SIERX_SESSION_KEY: ci-only-not-a-secret-000000000000000000000000
      SIERX_AUTH_MODE: local
      SIERX_BASE_URL: http://localhost:8080
      SIERX_TRUSTED_PROXIES: ""

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # The PostgreSQL client binaries the gate's psql-based steps need.
      # Not "inline shell doing work": it installs a dependency, it does not
      # implement a check.
      - name: install postgresql-client-18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 gcc libc6-dev
          # Hosted runners also have older PostgreSQL clients. Select the whole
          # PG18 tool suite, not just psql (whose wrapper may choose differently).
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - run: make web-prepare
      - run: make gate-2

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-review
          if-no-files-found: ignore
          path: |
            web/dist/budget.json
            web/dist/composition.html
            web/test-results/**/detail-light.png
            web/test-results/**/backlog-light.png
            web/test-results/**/bootstrap-network.json
